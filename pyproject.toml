[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-workkit"
version = "0.1.0"
description = "Foundation for the OpenCode Workkit"
requires-python = ">=3.12"
dependencies = ["jsonc-document==2026.10.15"]

[project.scripts]
workkit = "workkit:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "check",
    "config",
    "environment",
    "install",
    "instructions",
    "own_mcp",
    "paths",
    "recipes",
    "selection",
    "storage",
    "sync",
    "workkit",
]
